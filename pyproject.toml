[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auralguard"
version = "0.1.0"
description = "Multi-view one-class detection of AI-generated speech"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [{ name = "AuralGuard authors" }]
keywords = ["audio-deepfake", "anti-spoofing", "synthetic-speech-detection", "asvspoof"]

dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "transformers>=4.40",      # WavLM / XLS-R / HuBERT backbones
    "einops>=0.7",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
train = ["tensorboard>=2.14", "wandb>=0.16", "torch-audiomentations>=0.11"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "gradio>=4.0", "onnxruntime>=1.17"]
dev = ["pytest>=7.4", "ruff>=0.4", "black>=24.0", "isort>=5.12", "pre-commit>=3.6", "mypy>=1.8"]

[project.scripts]
auralguard-train = "auralguard.training.cli:main"
auralguard-eval = "auralguard.evaluation.cli:main"
auralguard-predict = "auralguard.inference.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
