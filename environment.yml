name: auralguard
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch>=2.1
  - torchaudio>=2.1
  - pytorch-cuda=12.1     # drop this line for CPU-only installs
  - numpy>=1.24
  - scipy>=1.10
  - librosa>=0.10
  - soundfile>=0.12
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pip:
      - -e .[train,serve,dev]
